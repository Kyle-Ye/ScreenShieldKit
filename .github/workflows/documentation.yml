name: Documentation

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-26
    env:
      DOCC_RENDERER_REPOSITORY: OpenSwiftUIProject/swift-docc-render-artifact
      DOCC_RENDERER_REF: release/6.3-colorful
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: .docs/cache/versioned-docc
          key: versioned-docc-${{ runner.os }}-${{ hashFiles('.vdc.json', 'Package.resolved') }}-${{ github.ref_type }}-${{ github.sha }}
          restore-keys: |
            versioned-docc-${{ runner.os }}-${{ hashFiles('.vdc.json', 'Package.resolved') }}-
            versioned-docc-${{ runner.os }}-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Prepare Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version
        shell: bash

      - name: Check out DocC renderer
        run: |
          renderer_path="${RUNNER_TEMP}/swift-docc-render-artifact"
          rm -rf "$renderer_path"
          git clone \
            --depth 1 \
            --filter=blob:none \
            --single-branch \
            --branch "$DOCC_RENDERER_REF" \
            "https://github.com/${DOCC_RENDERER_REPOSITORY}.git" \
            "$renderer_path"
          test -d "$renderer_path/dist"
          echo "DOCC_HTML_DIR=$renderer_path/dist" >> "$GITHUB_ENV"
        shell: bash

      - uses: oras-project/setup-oras@v1

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - uses: OpenSwiftUIProject/VersionedDocC@0.0.8
        with:
          config: .vdc.json
          publish-oci-cache: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs/build/versioned-site/ScreenShieldKit

  deploy:
    name: Deploy DocC site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
